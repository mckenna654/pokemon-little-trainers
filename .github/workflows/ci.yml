name: CI

# What this proves, and what it does not:
#  - "checks": the repo holds no ROMs/saves/secrets (tip and full history), scripts lint, unit tests pass.
#  - "build": the pinned upstream source still rebuilds byte-identical to official FireRed v1.1
#    (checked by SHA-1; the original ROM is never present in CI), our patches apply and really
#    compile, and the automated emulator play-through passes on the ROM compiled in this job.
# Nothing is uploaded: no artifacts, no ROM secrets. Hands-on play testing is local (docs/TESTING.md).

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Hygiene, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No ROMs, saves, BIOS, patches or credentials (tracked files)
        run: scripts/check-forbidden.sh
      - name: No forbidden content anywhere in history
        run: scripts/check-forbidden.sh --history
      - name: Shell lint
        run: shellcheck -S warning scripts/*.sh .githooks/pre-commit
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -t . -v

  build:
    name: Compile baseline + Little Trainers, emulator tests
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache toolchain builds (agbcc, mGBA core, Flips)
        uses: actions/cache@v4
        with:
          path: |
            work
            game
          key: work-${{ runner.os }}-${{ hashFiles('upstream.lock', 'scripts/setup.sh', 'scripts/build-emu.sh', 'scripts/build-flips.sh', 'tools/gbarun.c') }}-v1
      - name: Set up (apt packages, pinned upstream, agbcc, apply patches, test tools)
        run: FORCE=1 scripts/setup.sh
      - name: Baseline matches official v1.1 checksum
        run: scripts/build.sh baseline
      - name: Build Little Trainers (proves the patches compile)
        run: scripts/build.sh
      - name: Unit + emulator tests on the compiled ROM
        run: scripts/test.sh
      - name: Nothing ROM-like became tracked
        run: scripts/check-forbidden.sh
